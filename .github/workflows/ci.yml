name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Node workspace
            uses: ./.github/actions/setup-agent-vm
            with:
              build: 'false'

          - name: Set up Python workspace
            uses: ./.github/actions/setup-python-workspace

      - name: Quality checks
        run: pnpm check

      - parallel:
          - name: Unit tests
            run: pnpm test:unit

          - name: Integration tests
            run: pnpm test:integration

          - name: Host Python tests
            run: pnpm python:test:host

  e2e-host:
    name: E2E (${{ matrix.lane }})
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        lane:
          - host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up system packages
        id: system-packages
        background: true
        uses: ./.github/actions/setup-system-packages

      - name: Set up Node workspace
        uses: ./.github/actions/setup-agent-vm
        with:
          build: 'false'

      - name: Restore Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.61.1-chromium-headless-shell

      - wait: system-packages

      - name: Install Chromium for Playwright
        id: chromium
        background: true
        run: pnpm --filter ./packages/sign-in-test-support exec playwright install --with-deps --only-shell chromium

      - name: Build workspace
        run: pnpm build

      - wait-all:

      - name: Record browser version
        run: |
          pnpm --filter ./packages/sign-in-test-support exec playwright --version
          pnpm --filter ./packages/sign-in-test-support exec node --input-type=module -e '
            import { chromium } from "playwright";
            const browser = await chromium.launch({ timeout: 0 });
            try {
              console.log(`Chromium ${browser.version()}`);
            } finally {
              await browser.close();
            }
          '

      - name: Run E2E lane
        env:
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD: '1'
        run: pnpm run test:e2e:${{ matrix.lane }}

      - name: Upload browser failure summaries
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-in-browser-failures
          path: ${{ runner.temp }}/switchboard-browser-failures/*.txt
          if-no-files-found: ignore

  check:
    name: check
    if: always()
    needs:
      - validation
      - e2e-host
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          E2E_HOST_RESULT: ${{ needs.e2e-host.result }}
        run: |
          set -euo pipefail
          results=(
            "validation=${VALIDATION_RESULT}"
            "e2e-host=${E2E_HOST_RESULT}"
          )
          printf '%s\n' "${results[@]}"
          for result in "${results[@]}"; do
            if [[ "${result##*=}" != success ]]; then
              echo "CI lane did not pass: ${result}" >&2
              exit 1
            fi
          done
